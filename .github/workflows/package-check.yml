name: Package check

# Builds the deb/rpm packages and the image without publishing anything,
# so packaging changes are tested on every PR.
on:
  pull_request:
  push:
    branches:
      - ci/package-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ github.workspace }}/go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: |
            build/*.deb
            build/*.rpm

      - name: Save images
        run: |
          mkdir -p ctx/linux/amd64
          cp build/rds_exporter_linux_amd64_v1/rds_exporter ctx/linux/amd64/
          docker buildx build --load --platform linux/amd64 -f .scripts/Dockerfile -t rds_exporter:test ctx
          docker run --rm rds_exporter:test --version
          docker save -o rds_exporter-image-amd64.tar rds_exporter:test

      - name: Upload images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images
          path: rds_exporter-image-amd64.tar
